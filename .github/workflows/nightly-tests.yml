name: PR Nightly Tests (Simulated)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # Optional: runs on new commits to the PR

  schedule:
    # Run every minute to simulate nightly tests
    - cron: '52 18 * * *'

jobs:
  nightly-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Run Tests
        run: |
          # Simulate running tests (replace this with your actual test commands)
          echo "Running tests..."
          echo "Tests completed successfully." > test-results.txt

      - name: Check Test Results
        id: test-status
        run: |
          # Always mark status as success for this simulation
          echo "status=success" >> $GITHUB_ENV

      - name: Set PR Status
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.status, // Dynamically set to 'success' or 'failure'
              context: 'Nightly Tests',
              description: `Nightly test results: ${process.env.status}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
