name: PR Daily Tests

on:
  workflow_dispatch:

jobs:
  nightly-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Identify Open PRs with Recent Commits
        id: pr-list
        uses: actions/github-script@v6
        with:
          script: |
            const { Octokit } = require("@octokit/rest");
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const oneDayAgo = new Date();
            oneDayAgo.setDate(oneDayAgo.getDate() - 1);

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const filteredPRs = [];
            for (const pr of prs.data) {
              const commits = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              const recentCommits = commits.data.filter(commit => {
                const commitDate = new Date(commit.commit.author.date);
                return commitDate >= oneDayAgo;
              });

              if (recentCommits.length > 0) {
                filteredPRs.push({ number: pr.number, sha: pr.head.sha });
              }
            }

            console.log("Filtered PRs with recent commits:", filteredPRs);
            core.setOutput('pr-numbers', JSON.stringify(filteredPRs));
          result-encoding: json
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug PR Numbers
        run: |
          echo "PR Numbers: ${{ steps.pr-list.outputs.pr-numbers }}"

      - name: Run Tests for Open PRs
        if: ${{ steps.pr-list.outputs.pr-numbers != '[]' }}
        run: |
          echo "Running tests for PRs with recent commits..."
          # Replace with actual test commands
          echo "Tests completed successfully." > test-results.txt

      - name: Update PR Status
        if: ${{ steps.pr-list.outputs.pr-numbers != '[]' }}
        uses: actions/github-script@v6
        with:
          script: |
            const prs = JSON.parse('${{ steps.pr-list.outputs.pr-numbers }}');
            for (const pr of prs) {
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.sha,
                state: 'success', // Update based on actual test results
                context: 'Nightly Tests',
                description: `Nightly test results: success`,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
